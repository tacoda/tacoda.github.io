      html,
      body {
        background-color: #07070b;
        color: #e5e7eb;

      body {
        font-family:
          'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',

        text-rendering: optimizeLegibility;

      /* Grid backdrop */
      .bg-grid {
        background-image:
          linear-gradient(rgba(139, 92, 246, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(139, 92, 246, 0.07) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(
          ellipse at 50% 0%,
          #000 30%,
          transparent 75%
        );
      }

      /* Animated gradient text */
      .gradient-text {
        background: linear-gradient(
          90deg,
          #a78bfa,
          #22d3ee,
          #f472b6,
          #a78bfa
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradientX 10s ease infinite;
      }

      /* Glass card */
      .glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.015)
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
      }

      .glass-hover {
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.35s ease,
          background-color 0.35s ease,
          box-shadow 0.35s ease;
      }
      .glass-hover:hover,
      .reveal.visible.glass-hover:hover {
        transform: translateY(-6px);
        border-color: rgba(167, 139, 250, 0.35);
        box-shadow:
          0 24px 48px -20px rgba(139, 92, 246, 0.4),
          0 0 0 1px rgba(167, 139, 250, 0.18) inset;
      }

      /* Glow blobs */
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(80px);
        opacity: 0.5;
        pointer-events: none;
      }

      /* Nav link */
      .nav-link {
        position: relative;
        color: rgb(203 213 225);
        transition: color 0.25s ease;
      }
      .nav-link:hover {
        color: #fff;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 2px;
        background: linear-gradient(90deg, #a78bfa, #22d3ee);
        border-radius: 2px;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .nav-link.active,
      .nav-link:hover {
        color: #fff;
      }
      .nav-link.active::after,
      .nav-link:hover::after {
        transform: scaleX(1);
      }

      /* Reveal on scroll */
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Terminal caret */
      .caret::after {
        content: '▍';
        margin-left: 2px;
        color: #a78bfa;
        animation: blink 1.1s steps(1) infinite;
      }

      /* Button shine */
      .btn-primary {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
        transition:
          transform 0.2s ease,
          box-shadow 0.3s ease;
        box-shadow: 0 10px 30px -10px rgba(124, 58, 237, 0.6);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 40px -12px rgba(124, 58, 237, 0.8);
      }
      .btn-primary::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.25) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .btn-primary:hover::before {
        transform: translateX(100%);
      }

      .btn-ghost {
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition:
          border-color 0.25s ease,
          background-color 0.25s ease,
          transform 0.2s ease;
      }
      .btn-ghost:hover {
        border-color: rgba(167, 139, 250, 0.5);
        background: rgba(167, 139, 250, 0.08);
        transform: translateY(-2px);
      }

      /* Route transition */
      .route {
        animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Subtle scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0b0b12;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a3a;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a4d;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

              <path d="M111.8 62.2C170.2 105.9 233 194.7 256 242.4c23-47.6 85.8-136.4 144.2-180.2c42.1-31.6 110.3-56 110.3 21.8c0 15.5-8.9 130.5-14.1 149.2C478.2 298 412 314.6 353.1 304.5c102.9 17.5 129.1 75.5 72.5 133.5c-107.4 110.2-154.3-27.6-166.3-62.9c-1.7-4.9-2.6-7.8-3.3-7.8s-1.6 3-3.3 7.8c-12 35.3-58.9 173.1-166.3 62.9c-56.5-58-30.4-116 72.5-133.5C100 314.6 33.8 298 15.7 233.1C10.4 214.4 1.5 99.4 1.5 83.9c0-77.8 68.2-53.4 110.3-21.8z" />
            </svg>
          </a>
        </div>
      </div>
    </footer>

    <script>
      // Year
      document.getElementById('year').textContent = new Date().getFullYear();

      // --- Projects data ---
      const aiProjects = [
        {
          name: 'Keystone',
          tag: 'Charter Framework',
          color: 'from-violet-500 to-fuchsia-500',
          href: '/keystone',
          desc: 'A charter framework that makes AI-generated code reliable, installed in one command, owned by your repo, working across any coding agent.',
        },
        {
          name: 'Open-Refinery',
          tag: 'Lights-On Factory',
          color: 'from-cyan-400 to-sky-500',
          href: '/open-refinery',
          desc: 'A lights-on factory for AI-driven software work, every change authorized, owned, provenanced, and audited. Automation you can actually trust, because you can see it.',
        },
        {
          name: 'Sigma',
          tag: 'Coding Agent CLI',
          color: 'from-emerald-400 to-teal-500',
          href: '/sigma',
          desc: 'A coding-agent CLI in Go that reuses your Claude Code subscription, no API key. A minimal but complete agent harness with tools, permissions, sub-agents, and resumable sessions.',
        },
      ];

      const rubyProjects = [
        {
          name: 'Caml',
          tag: 'Task Runner',
          color: 'from-amber-400 to-orange-500',
          href: '/caml',
          desc: 'A task runner that turns a simple caml.yaml into dynamic tools you can scaffold, list, and run, automation you can read at a glance.',
        },
        {
          name: 'Otto',
          tag: 'Static Site Generator',
          color: 'from-pink-400 to-rose-500',
          href: '/otto',
          desc: 'A static site generator built for speed. Init, build, and serve with a handful of commands, no ceremony between an idea and a live page.',
        },
        {
          name: 'Reins',
          tag: 'Web Framework',
          color: 'from-indigo-400 to-violet-500',
          href: '/reins',
          desc: 'A web framework that reins in the full power of Ruby. Generate a project and boot the server in minutes, convention where it helps, control where you need it.',
        },
      ];

      function cardHtml(p, i) {
        return `
          <a href="${p.href}" class="glass glass-hover reveal group relative overflow-hidden rounded-2xl p-6" style="transition-delay:${i * 60}ms">
            <div class="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full bg-gradient-to-br ${p.color} opacity-20 blur-2xl transition-opacity duration-500 group-hover:opacity-40"></div>
            <div class="relative">
              <div class="flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-2.5 py-1 font-mono text-[10px] uppercase tracking-widest text-slate-300">
                  ${p.tag}
                </span>
                <span class="text-slate-500 transition group-hover:translate-x-0.5 group-hover:text-white">↗</span>
              </div>
              <h3 class="mt-6 text-2xl font-bold tracking-tight text-white">
                <span class="bg-gradient-to-r ${p.color} bg-clip-text text-transparent">${p.name}</span>
              </h3>
              <p class="mt-3 text-sm leading-6 text-slate-400">${p.desc}</p>
            </div>
          </a>`;
      }

      function renderProjects() {
        const aiGrid = document.getElementById('project-grid');
        const rubyGrid = document.getElementById('ruby-grid');
        if (aiGrid) aiGrid.innerHTML = aiProjects.map(cardHtml).join('');
        if (rubyGrid) rubyGrid.innerHTML = rubyProjects.map(cardHtml).join('');
        observeReveals();
      }

      // --- Router ---
      const routes = {
        '/': 'route-home',
        '/about': 'route-about',
        '/projects': 'route-projects',
        '/resources': 'route-resources',
      };

      function currentRoute() {
        return location.pathname.replace(/\/+$/, '') || '/';
      }

      function render() {
        const app = document.getElementById('app');
        const route = currentRoute();
        const tplId = routes[route] || 'route-404';
        const tpl = document.getElementById(tplId);
        app.innerHTML = '';
        app.appendChild(tpl.content.cloneNode(true));

        // active nav
        document.querySelectorAll('[data-route]').forEach((el) => {
          el.classList.toggle('active', el.dataset.route === route);
        });

        // route-specific
        if (route === '/projects') renderProjects();
        observeReveals();

        // close mobile nav on nav
        document.getElementById('mobileNav')?.classList.add('hidden');

        // scroll top on route change
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      }

      window.addEventListener('popstate', render);
      window.addEventListener('DOMContentLoaded', () => {
        // Deep links land on 404.html, which stashes the path and bounces to /
        const deep = sessionStorage.getItem('spaPath');
        if (deep) {
          sessionStorage.removeItem('spaPath');
          history.replaceState(null, '', deep);
        }
        render();
      });

      // Intercept internal links so the router owns them instead of the network
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-link]');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        const href = a.getAttribute('href');
        if (!href || !href.startsWith('/')) return;
        e.preventDefault();
        if (href !== location.pathname) history.pushState(null, '', href);
        render();
      });

      // Mobile menu
      document.getElementById('menuBtn')?.addEventListener('click', () => {
        document.getElementById('mobileNav').classList.toggle('hidden');
      });

      // Reveal-on-scroll observer
      let io;
      function observeReveals() {
        if (io) io.disconnect();
        io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12 },
        );
        document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
      }
    </script>
  </body>
</html>
